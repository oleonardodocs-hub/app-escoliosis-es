<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escoliosis Infantil y Adolescente | Tus protocolos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1b3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#070f24;--navy-800:#0d1b3e;--navy-700:#14275a;--navy-600:#1f3b73;
  --orange:#b8892e;--orange-2:#cfa24a;--gold:#d9b46a;--blue:#2563eb;--terra:#c95a14;
  --panel:#f1f3f9;--ink:#0f1a3a;--muted:#7a83a3;--line:#e6e9f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:250px 420px 1fr;min-height:100vh}

/* sidebar */
.side{padding:32px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.05}
.logo-mark{width:40px;height:40px;border-radius:50%;background:var(--navy-800);color:var(--orange);display:grid;place-items:center;font-size:21px}
.logo small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.nav-t{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:40px 12px 10px}
.nav{display:grid;gap:4px}
.nav button,.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;color:var(--muted);font-weight:600;font-size:13.5px;width:100%;line-height:1.3}
.nav .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:var(--panel)}
.nav .on{color:var(--ink);background:var(--panel)}
.nav .on .ni{background:var(--orange);color:#fff;box-shadow:0 8px 18px rgba(184,137,46,.35)}
.nav button:hover,.nav a:hover{color:var(--ink)}
.side-card{margin-top:auto;background:var(--navy-800);color:#fff;border-radius:18px;padding:20px}
.side-card b{display:block;font-size:14px;margin-bottom:4px}
.side-card p{font-size:12.5px;color:#c3cbe6;line-height:1.5}

/* middle */
.mid{background:var(--panel);border-radius:34px;margin:14px 0;padding:34px 28px;overflow:auto;max-height:calc(100vh - 28px);position:sticky;top:14px}
.mid h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mid .sub{color:var(--orange);font-weight:700;font-size:14px;margin-top:6px}
.count{display:flex;gap:10px;margin:22px 0 26px}
.count div{flex:1;background:#fff;border-radius:16px;padding:14px 16px}
.count b{display:block;font-size:22px;line-height:1.1}
.count span{font-size:12px;color:var(--muted)}
.mods-t{font-size:17px;color:var(--muted);font-weight:600;margin-bottom:14px}
.mods{display:grid;gap:14px}
.mod{border-radius:20px;padding:18px;color:#fff;display:grid;grid-template-columns:50px 1fr 62px;gap:14px;align-items:center;width:100%;transition:transform .2s,box-shadow .2s}
.mod:hover{transform:translateY(-2px)}
.mod.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--orange)}
.mod.light{color:var(--navy-800)}
.mod .ci{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.mod.light .ci{background:rgba(11,21,48,.08)}
.mod small{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.8}
.mod h3{font-size:15px;line-height:1.3;font-weight:800;margin-top:2px}
.mod .num{background:#fff;color:var(--navy-800);border-radius:12px;text-align:center;padding:8px 4px}
.mod .num b{display:block;font-size:19px;line-height:1.1}
.mod .num span{font-size:10px;color:var(--muted)}

/* right */
.right{padding:34px 36px 60px;min-width:0}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.back{display:none;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);margin:16px 0 0}
.mh{display:flex;align-items:center;gap:16px;margin:30px 0 8px}
.mh .ci{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.mh small{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
.mh h2{font-size:22px;line-height:1.25;letter-spacing:-.01em}
.mdesc{color:var(--muted);font-size:14px;margin-bottom:20px}
.docs{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.doc .di{width:40px;height:40px;border-radius:11px;background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--navy-700)}
.doc b{font-size:14px;display:block;line-height:1.35}
.doc small{font-size:12px;color:var(--muted)}
.doc .ok{color:#16a34a;font-weight:700}
.acts{display:flex;gap:8px}
.dl{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800}
.dl.w{background:var(--navy-800);color:#fff}
.dl.p{background:#fdeee2;color:var(--terra)}
.none{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.guide{display:grid;gap:12px;margin-top:26px}
.step{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:34px 1fr;gap:14px}
.step i{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.step b{display:block;margin-bottom:3px}
.step p{font-size:14px;color:#4a5375;line-height:1.55}
.note{background:var(--panel);border-left:4px solid var(--orange);border-radius:8px;padding:14px 16px;font-size:13px;color:#4a5375;line-height:1.55}

.nav-t2{margin-top:26px}
.star{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#c0c6d8}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:22px;width:100%}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--navy-700);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.hello b{display:block;font-size:15px}
.hello small{font-size:12px;color:var(--orange);font-weight:700}
/* agenda */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:8px}
.tabs button{padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.tabs .add{margin:0 0 6px auto;padding:9px 14px;border-bottom:0;white-space:nowrap}
.tabs button{white-space:nowrap}
.add{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 18px rgba(184,137,46,.3)}
.grid-wrap{overflow-x:auto}
.week{position:relative;display:grid;grid-template-columns:48px repeat(6,minmax(72px,1fr));min-width:540px}
.week .dh{text-align:center;font-size:12px;font-weight:700;padding:12px 0}
.week .dh small{display:block;color:var(--muted);font-weight:500}
.week .dh.today{color:var(--orange)}
.week .tc{font-size:10px;color:var(--muted);height:44px;padding-top:2px}
.week .cell{border-left:1px solid var(--line);border-top:1px dashed var(--line);height:44px;cursor:pointer}
.week .cell:hover{background:#fff7f1}
.appt{position:absolute;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 6px 14px rgba(15,26,58,.15);cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.modal{position:fixed;inset:0;background:rgba(7,13,31,.55);display:none;place-items:center;z-index:60;padding:20px}
.modal.on{display:grid}
.box{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:420px;display:grid;gap:14px}
.box h3{font-size:18px}
.box label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:6px}
.box input,.box select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font:inherit;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors{display:flex;gap:10px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.box-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn{padding:12px 18px;border-radius:12px;font-weight:800;font-size:14px}
.btn.pri{background:var(--orange);color:#fff}
.btn.sec{background:var(--panel)}
.btn.del{color:#dc2626;margin-right:auto}
.lz-card{border-radius:20px;padding:18px;color:#fff;display:grid;grid-template-columns:50px 1fr 62px;gap:14px;align-items:center;width:100%;background:linear-gradient(135deg,#0d1b3e,#1f3b73);border:2px solid var(--orange);margin-top:14px}
.lz-card .ci{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:var(--orange-2)}
.lz-card small{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--orange-2)}
.lz-card h3{font-size:15px;line-height:1.3;font-weight:800;margin-top:2px}
.lz-card .num{background:#fff;color:var(--navy-800);border-radius:12px;text-align:center;padding:8px 4px}
.lz-card .num b{display:block;font-size:19px;line-height:1.1}.lz-card .num span{font-size:10px;color:var(--muted)}
.lzl{display:grid;gap:10px}
.lzi{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.lzi .th{width:54px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0d1b3e,#1f3b73);display:grid;place-items:center;color:var(--orange-2)}
.lzi b{display:block;font-size:14px}.lzi small{font-size:12px;color:var(--muted)}
.lzi .ok{color:#16a34a;font-weight:700}
.player{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#1f3b73,#0d1b3e 60%,#070f24);color:#fff;margin-top:20px;box-shadow:0 24px 60px rgba(13,27,62,.35)}
.scene{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:6% 10% 18%;opacity:0;transform:scale(1.03);transition:opacity .7s,transform 7s linear}
.scene.on{opacity:1;transform:scale(1)}
.scene .big{width:clamp(64px,12vw,110px);height:clamp(64px,12vw,110px);border-radius:50%;border:2px solid var(--orange);display:grid;place-items:center;color:var(--orange-2);margin:0 auto 4%;box-shadow:0 0 0 10px rgba(184,137,46,.08),0 0 0 22px rgba(184,137,46,.05);animation:pulse 3s ease-in-out infinite}
.scene .big svg{width:45%;height:45%}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(184,137,46,.12),0 0 0 30px rgba(184,137,46,.04)}}
.scene h3{font-family:Georgia,serif;font-size:clamp(17px,2.6vw,28px);letter-spacing:.02em;margin-bottom:2%}
.scene p{font-size:clamp(12.5px,1.6vw,17px);color:#d5dbef;max-width:640px;margin:0 auto;line-height:1.55}
.scene .tag{position:absolute;top:5%;left:5%;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--orange-2)}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(transparent,rgba(7,15,36,.9));display:flex;align-items:center;gap:12px}
.ctrl button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.ctrl button.pp{background:var(--orange)}
.bars{flex:1;display:flex;gap:4px}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.bars i b{position:absolute;inset:0;width:0;background:var(--orange-2)}
.ctrl small{font-size:11px;color:#c3cbe6;white-space:nowrap}
.cap{margin-top:16px;font-size:14px;color:#4a5375;line-height:1.6}
.dl.v{background:var(--panel);color:var(--navy-800)}
.bnav{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--navy-800);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1200px){
  .app{grid-template-columns:84px 380px 1fr}
  .side{padding:28px 14px;align-items:center}
  .logo span,.nav-t,.nav .lbl,.side-card{display:none}
  .nav button,.nav a{justify-content:center;padding:6px}
}
@media(max-width:860px){
  .app{display:block}
  .side{display:none}
  .mid{position:static;max-height:none;margin:0;border-radius:0 0 28px 28px;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 28px}
  .right{padding:24px 18px 50px}
  body.open .mid{display:none}
  body:not(.open) .right .module{display:none}
  body.open .back{display:inline-flex}
  body:not(.open) .mod.sel{box-shadow:none}
  .tabs{gap:16px;font-size:12px}
  .doc{grid-template-columns:36px 1fr}
  .doc .di{width:36px;height:36px}
  .acts{grid-column:1/-1;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .doc>span{min-width:0}
  .dl{padding:8px 10px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .player{aspect-ratio:3/4}
  .scene{padding:10% 8% 22%}
  .bnav{display:flex;justify-content:space-around;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 10px;text-align:center}
  .bnav button.on{color:var(--orange)}
}

.doc{grid-template-columns:40px 1fr auto}
.doc .di{text-align:center}
.dt{text-align:left;min-width:0}
.dt b{font-size:14px;display:block;line-height:1.35}.dt small{font-size:12px;color:var(--muted)}.dt .ok{color:#16a34a;font-weight:700}
.doc:hover{border-color:var(--orange)}
.nav-t3{margin-top:20px}
.side{overflow-y:auto}
@media(max-height:960px){.side-card{display:none}.nav-t{margin:26px 12px 8px}.nav-t2{margin-top:18px}.nav button,.nav a{padding:7px 10px}}
.btn-d{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:800;background:var(--panel);color:var(--navy-800)}
.btn-d.on{background:#e3f6ea;color:#15803d}
body.lock{overflow:hidden}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(7,15,36,.72);display:none;padding:22px;justify-content:center}
.viewer.on{display:flex}
.vwrap{width:100%;max-width:1000px;background:#fff;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.vbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vbar b{flex:1;font-size:13px;color:var(--muted);letter-spacing:.06em;min-width:120px}
.vbar .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel)}
#vBody{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.vnav{display:flex;justify-content:space-between;padding:10px 30px 26px}
.vnav button{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--panel);font-weight:800;font-size:13px}
.pdoc{padding:0 0 10px;color:var(--ink)}
.ph{background:linear-gradient(135deg,var(--navy-800),var(--navy-600));color:#fff;padding:26px 30px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ph small{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.ph h1{font-family:Georgia,'Playfair Display',serif;font-size:24px;line-height:1.22;margin-top:6px;letter-spacing:-.01em}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;white-space:nowrap}
.ob{margin:20px 30px 0;background:#fbf7ec;border-left:4px solid var(--orange);border-radius:10px;padding:14px 16px}
.ob b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.ob p{margin-top:4px;font-size:15px;line-height:1.55}
.figs{display:grid;gap:14px;margin:18px 30px 0}
.figs.two{grid-template-columns:1.25fr 1fr}
.fc{background:#fbf8f1;border:1px solid var(--line);border-radius:16px;padding:10px;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fc svg{width:100%;height:auto;max-height:340px}
.fc.sp svg{width:auto;max-width:100%;max-height:340px}
.fc figcaption{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.ps{margin:18px 30px 0}
.ps h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:6px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:800}
.ps p,.ps li{font-size:14.5px;line-height:1.6;color:#2a3354}
.pl{padding-left:22px;display:grid;gap:6px}
ol.pl li::marker{font-weight:800;color:var(--orange)}
.warn{background:#fff7f1;border:1px solid #f1d9c6;border-radius:12px;padding:12px 16px}
.pf{margin:22px 30px 10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{background:#f5efe0;text-align:left;padding:8px 10px;border:1px solid #e2d8bd;font-size:12px}
.tb td{padding:8px 10px;border:1px solid #e8e2d3;vertical-align:top;line-height:1.45}
.tb td.bl{height:30px}
.tb tr.sec td{background:#14275a;color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em}
.tb td.ck{text-align:center;font-weight:800}
.tl{display:flex;gap:3px;margin:2px 0 14px;border-radius:12px;overflow:hidden}
.tl span{color:#fff;font-size:11px;font-weight:700;padding:9px 8px;min-width:0;overflow:hidden;line-height:1.25;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tl b{display:block;font-size:13px;font-weight:800}
@media(max-width:860px){
  .viewer{padding:0}.vwrap{border-radius:0;max-width:none}
  .ph{padding:20px 18px;flex-direction:column}.ph h1{font-size:21px}
  .ob,.figs,.ps,.pf{margin-left:18px;margin-right:18px}.figs.two{grid-template-columns:1fr}.vnav{padding:10px 18px 24px}
  .vbar{padding:10px 12px}.vbar b{display:none}
  .doc .dt{grid-column:2}
  .fc svg,.fc.sp svg{max-height:250px}
}
/* PDF */
body.print{background:#fff;font-family:'Plus Jakarta Sans','DejaVu Sans',Arial,sans-serif;font-size:12px}
body.print .pdoc{max-width:none}
body.print .ph{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:20px 22px}
body.print .ph h1{font-size:20px}
body.print .ob,body.print .figs,body.print .ps,body.print .pf{margin-left:4px;margin-right:4px}
body.print .ob{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.print .fc{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
body.print .fc svg{max-height:250px}

};
function ic(n,s,w){return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'}
var LAB={ex:['Indicación','Posición inicial','Ejecución paso a paso','Dosificación','Progresión','Errores frecuentes','Precauciones'],
 cu:['Qué observar','Prioridades de la sesión','Secuencia de trabajo','Dosificación','Progresión','Error frecuente','Precauciones'],
 as:['Indicación','Posición inicial','Cómo se realiza','','','','Precauciones']};
function listHTML(a,ord){return '<'+(ord?'ol':'ul')+' class="pl">'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</'+(ord?'ol':'ul')+'>'}
function tabHTML(t){
  var h='<div class="tw"><table class="tb"><thead><tr>'+t.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';
  t.rows.forEach(function(r){
    if(r[0]==='SECCIÓN'){h+='<tr class="sec"><td colspan="'+t.cols.length+'">'+esc(r[1])+'</td></tr>';return}
    h+='<tr>'+r.map(function(c,i){return '<td'+(c===''?' class="bl"':'')+(i===0&&r.length>2&&c.length<3?' class="ck"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div>'}
var TLC=['#0d1b3e','#b8892e','#1f3b73','#d9c49a','#2f4a6d','#8c6a2f'];
function blkHTML(b){var tot=0;b.forEach(function(r){tot+=r[0]});
  var bar='<div class="tl">'+b.map(function(r,i){return '<span style="flex:'+r[0]+';background:'+TLC[i%6]+(i%6===3?';color:#0b1530':'')+'"><b>'+r[0]+' min</b>'+esc(r[1])+'</span>'}).join('')+'</div>';
  return bar+'<div class="tw"><table class="tb"><thead><tr><th>Min</th><th>Bloque</th><th>Contenido</th><th>Protocolos</th></tr></thead><tbody>'+b.map(function(r){return '<tr><td class="ck"><b>'+r[0]+'</b></td><td><b>'+esc(r[1])+'</b></td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'}).join('')+'<tr class="sec"><td colspan="4">Duración total: '+tot+' minutos</td></tr></tbody></table></div>'}
function sec(t,body){return body?'<section class="ps"><h3>'+t+'</h3>'+body+'</section>':''}
function renderDoc(d){
  var x=d.d,c=d.cat,L=LAB[x.ty]||LAB.ex,f=x.fig?figSVG(x.fig):'',m=x.sm?spineMap(x.sm.cv,{cobb:x.sm.cobb}):'';
  var h='<article class="pdoc"><header class="ph"><div><small>'+modLabel(c)+' · '+(c.id<=6?'PROTOCOLO ':'DOCUMENTO ')+d.nn+'</small><h1>'+esc(d.name)+'</h1></div><span class="chip lv-'+slug(x.lv)+'">'+esc(x.lv)+'</span></header>';
  h+='<section class="ob"><b>Objetivo</b><p>'+esc(x.ob)+'</p></section>';
  if(f||m){h+='<div class="figs'+(f&&m?' two':'')+'">'+(f?'<figure class="fc">'+f+'<figcaption>Flechas doradas: dirección del movimiento o de la corrección. Línea punteada: referencia.</figcaption></figure>':'')+(m?'<figure class="fc sp">'+m+'<figcaption>Vista posterior. D: derecha del paciente. Cambia el lado según la curva real.</figcaption></figure>':'')+'</div>'}
  if(x.ty==='fo'){h+=sec('Documento',tabHTML(x.tab))}
  else if(x.ty==='se'){h+=sec('Estructura de la sesión',blkHTML(x.blk))}
  else if(x.ty==='pl'){
    if(x.lst)h+=sec('Criterios',listHTML(x.lst,0));
    if(x.tab)h+=sec('Cuadro de referencia',tabHTML(x.tab));
    h+=sec('Pasos',listHTML(x.st,1))}
  else{
    h+=sec(L[0],x.ind?'<p>'+esc(x.ind)+'</p>':'')+sec(L[1],x.ini?'<p>'+esc(x.ini)+'</p>':'')+sec(L[2],x.st?listHTML(x.st,1):'');
    if(x.ty==='as'){h+=sec('Qué registrar',x.reg?'<p>'+esc(x.reg)+'</p>':'')+sec('Cómo interpretarlo',x.it?'<p>'+esc(x.it)+'</p>':'')}
    else{h+=sec(L[3],x.dos?'<p>'+esc(x.dos)+'</p>':'')+sec(L[4],x.pg?'<p>'+esc(x.pg)+'</p>':'')+sec(L[5],x.er?'<p>'+esc(x.er)+'</p>':'')}}
  if(x.pc)h+='<section class="ps warn"><h3>Precauciones</h3><p>'+esc(x.pc)+'</p></section>';
  return h+'<footer class="pf">Escoliosis Infantil y Adolescente · 70 Protocolos de Rehabilitación. Material de apoyo clínico: no sustituye el criterio del fisioterapeuta ni la valoración médica.</footer></article>'}
/* ===== vistas ===== */
var V=1,Q='';
function nDone(){return Object.keys(S.done).length}
function nFav(){return Object.keys(S.fav).length}
function $(id){return document.getElementById(id)}
function nav(){
  $('nav').innerHTML=CATS.filter(function(c){return c.id<=6}).map(function(c){return '<button data-v="'+c.id+'" class="'+(V===c.id&&!Q?'on':'')+'"><span class="ni">'+ROM[c.id-1]+'</span><span class="lbl">'+esc(c.s)+'</span></button>'}).join('');
  $('navb').innerHTML=CATS.filter(function(c){return c.id>6}).map(function(c){return '<button data-v="'+c.id+'" class="'+(V===c.id&&!Q?'on':'')+'"><span class="ni">'+(c.id-6)+'</span><span class="lbl">'+esc(c.s)+'</span></button>'}).join('');
  var t=[['fav','star','Favoritos'],['agenda','cal','Agenda'],['guia','guide','Cómo usar el manual']];
  $('nav2').innerHTML=t.map(function(x){return '<button data-v="'+x[0]+'" class="'+(V===x[0]&&!Q?'on':'')+'"><span class="ni">'+ic(x[1],16)+'</span><span class="lbl">'+x[2]+'</span></button>'}).join('');
  var b=[['home','grid','Módulos'],['fav','star','Favoritos'],['agenda','cal','Agenda'],['guia','guide','Guía']],open=document.body.classList.contains('open');
  $('bnav').innerHTML=b.map(function(x){var on=x[0]==='home'?(!open||typeof V==='number'):(open&&V===x[0]);return '<button data-v="'+x[0]+'" class="'+(on?'on':'')+'">'+ic(x[1],20)+x[2]+'</button>'}).join('')}
function modCard(c){return '<button class="mod'+(c.light?' light':'')+(V===c.id&&!Q?' sel':'')+'" style="background:'+c.c+'" data-v="'+c.id+'"><span class="ci">'+ic(c.ic,25,1.8)+'</span><span><small>'+modLabel(c)+'</small><h3>'+esc(c.t)+'</h3></span><span class="num"><b>'+c.docs.length+'</b><span>'+unitName(c)+'</span></span></button>'}
function mid(){
  var ini=(S.name||'?').split(/\s+/).filter(Boolean).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
  $('mid').innerHTML='<button class="hello" data-name title="Cambiar tu nombre"><span class="avatar">'+esc(ini)+'</span><span><b>'+(S.name?'Hola, '+esc(S.name)+'.':'Te damos la bienvenida.')+'</b><small>'+(S.name?'Cambiar nombre':'Toca aquí para escribir tu nombre')+'</small></span></button>'+
  '<h1>Tus protocolos</h1><div class="sub">Escoliosis Infantil y Adolescente · 70 Protocolos de Rehabilitación</div>'+
  '<div class="count"><div><b>'+nProt()+'</b><span>protocolos</span></div><div><b>'+nDone()+'</b><span>completados</span></div><div><b>'+nFav()+'</b><span>favoritos</span></div></div>'+
  '<div class="mods-t">Elige un módulo</div><div class="mods">'+CATS.filter(function(c){return c.id<=6}).map(modCard).join('')+'</div>'+
  '<div class="mods-t" style="margin-top:22px">Bonus incluidos</div><div class="mods">'+CATS.filter(function(c){return c.id>6}).map(modCard).join('')+'</div>'}
function row(d,showCat){
  var lv=d.d.lv;
  return '<div class="doc"><button class="di" data-open="'+d.id+'" aria-label="Abrir">'+d.nn+'</button><button class="dt" data-open="'+d.id+'"><b>'+esc(d.name)+'</b><small>'+(showCat?modLabel(d.cat)+' · ':'')+esc(lv)+(S.done[d.id]?' · <span class="ok">✓ Completado</span>':'')+'</small></button>'+
  '<span class="acts"><button class="star'+(S.fav[d.id]?' on':'')+'" data-fav="'+d.id+'" aria-label="'+(S.fav[d.id]?'Quitar de favoritos':'Añadir a favoritos')+'" title="Favorito">'+ic('star',18)+'</button>'+
  '<button class="dl v" data-open="'+d.id+'">'+ic('eye',14,2.2)+'Abrir</button><a class="dl p" href="'+d.path+'.pdf" download data-dl="'+d.id+'">'+ic('down',14,2.4)+'PDF</a></span></div>'}
function head(icon,color,small,title,dark){return '<div class="mh"><span class="ci" style="background:'+color+(dark?';color:#0b1530':'')+'">'+ic(icon,26,1.8)+'</span><div><small>'+small+'</small><h2>'+title+'</h2></div></div>'}
/* agenda */
var DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb'],H0=7,H1=21,ROW=44,WEEK=0,COLS=['#b8892e','#0d1b3e','#d9c49a','#1f3b73','#8c6a2f'];
function monday(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function wkKey(off){var m=monday(off);return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()}
function agendaHTML(){
  var m=monday(WEEK),td=new Date();td.setHours(0,0,0,0);
  var h=head('cal','#11204a','Herramientas','Agenda de sesiones')+'<p class="mdesc">Organiza tus citas de la semana. Toca un hueco libre para añadir una. Los datos se guardan solo en este dispositivo.</p>';
  h+='<div class="tabs"><button data-wk="0" class="'+(WEEK===0?'on':'')+'">Esta semana</button><button data-wk="1" class="'+(WEEK===1?'on':'')+'">Próxima semana</button><button class="add" data-add>'+ic('plus',16,2.6)+'Nueva</button></div>';
  h+='<div class="grid-wrap"><div class="week" id="week"><div></div>';
  DAYS.forEach(function(d,i){var x=new Date(m);x.setDate(m.getDate()+i);h+='<div class="dh'+(+x===+td?' today':'')+'">'+d+'<small>'+x.getDate()+'/'+(x.getMonth()+1)+'</small></div>'});
  for(var t=H0;t<H1;t++){h+='<div class="tc">'+pad(t)+':00</div>';for(var i=0;i<6;i++)h+='<div class="cell" data-slot="'+i+'-'+t+'"></div>'}
  return h+'</div></div>'}
function drawAppts(){
  var wk=$('week');if(!wk)return;wk.querySelectorAll('.appt').forEach(function(e){e.remove()});
  var hd=wk.querySelector('.dh').offsetHeight,cw=(wk.offsetWidth-48)/6;
  S.ap.forEach(function(a,idx){if(a.w!==wkKey(WEEK))return;
    var el=document.createElement('div');el.className='appt';el.style.background=a.c;if(a.c==='#d9c49a')el.style.color='#0b1530';
    el.style.left=(48+a.d*cw+4)+'px';el.style.width=(cw-8)+'px';el.style.top=(hd+(a.s-H0)*ROW+3)+'px';el.style.height=((a.e-a.s)*ROW-6)+'px';
    el.textContent=a.t;el.title=a.t;el.onclick=function(ev){ev.stopPropagation();openModal(idx)};wk.appendChild(el)})}
var EDIT=-1,MC=COLS[0];
function openModal(idx,day,hour){
  EDIT=idx;var a=idx>=0?S.ap[idx]:{t:'',d:day||0,s:hour||9,e:(hour||9)+1,c:COLS[0]};
  $('mTitle').textContent=idx>=0?'Editar cita':'Nueva cita';$('mText').value=a.t;
  $('mDay').innerHTML=DAYS.map(function(d,i){return '<option value="'+i+'"'+(i==a.d?' selected':'')+'>'+d+'</option>'}).join('');
  var hs='';for(var t=H0;t<=H1;t++)hs+='<option value="'+t+'">'+pad(t)+':00</option>';
  $('mStart').innerHTML=hs;$('mEnd').innerHTML=hs;$('mStart').value=a.s;$('mEnd').value=a.e;$('mWeek').value=String(WEEK);
  MC=a.c;paint();$('mDel').hidden=idx<0;$('modal').classList.add('on');$('mText').focus()}
function paint(){$('mColors').innerHTML=COLS.map(function(c){return '<button type="button" data-c="'+c+'" class="'+(c===MC?'on':'')+'" style="background:'+c+'" aria-label="Color"></button>'}).join('')}
$('mColors').onclick=function(e){var b=e.target.closest('[data-c]');if(b){MC=b.dataset.c;paint()}};
function closeModal(){$('modal').classList.remove('on')}
$('mCancel').onclick=closeModal;$('modal').onclick=function(e){if(e.target.id==='modal')closeModal()};
$('mDel').onclick=function(){S.ap.splice(EDIT,1);save();closeModal();render()};
$('mSave').onclick=function(){var s=+$('mStart').value,e=+$('mEnd').value;if(e<=s)e=s+1;var wk=+$('mWeek').value;
  var a={t:$('mText').value.trim()||'Cita',d:+$('mDay').value,s:s,e:Math.min(e,H1),c:MC,w:wkKey(wk)};
  if(EDIT>=0)S.ap[EDIT]=a;else S.ap.push(a);WEEK=wk;save();closeModal();render()};
function right(){
  var h='<label class="search">'+ic('search',18)+'<input id="q" placeholder="Buscar entre los '+DOCS.length+' documentos" value="'+esc(Q)+'" aria-label="Buscar"></label>';
  h+='<div class="module"><button class="back" data-back>'+ic('back',18)+'Volver a los módulos</button>';
  if(Q){var r=DOCS.filter(function(d){return (d.name+' '+d.cat.t).toLowerCase().indexOf(Q)>-1});
    h+='<div class="mh"><div><small>Resultados</small><h2>'+r.length+' documentos encontrados</h2></div></div><div class="docs">'+(r.length?r.map(function(d){return row(d,1)}).join(''):'<p class="none">No se ha encontrado ningún documento.</p>')+'</div>'}
  else if(V==='fav'){var f=DOCS.filter(function(d){return S.fav[d.id]});
    h+=head('star','#d9b46a','Herramientas','Tus favoritos',1)+'<p class="mdesc">Los protocolos que más usas, siempre a mano.</p><div class="docs">'+(f.length?f.map(function(d){return row(d,1)}).join(''):'<p class="none">Todavía no tienes favoritos. Toca la estrella ☆ junto a un protocolo para guardarlo aquí.</p>')+'</div>'}
  else if(V==='agenda'){h+=agendaHTML()}
  else if(V==='guia'){
    var st=[['Elige un módulo','Cada módulo reúne una fase del trabajo: valoración, planificación, corrección, estabilización, respiración y protocolos por tipo de curva. También puedes buscar por nombre.'],['Abre el protocolo','Verás una ilustración esquemática, la posición inicial, los pasos, la dosificación, la progresión y los errores frecuentes.'],['Adapta el lado a cada paciente','Los esquemas muestran un ejemplo de curva torácica derecha. Invierte el lado según la curva real de tu paciente.'],['Marca como completado','Pulsa el botón de la parte superior del protocolo para llevar el control de lo que ya has revisado.'],['Descarga el PDF','Cada documento tiene su PDF para imprimir o entregar al paciente. Los bonus incluyen fichas, un programa respiratorio y sesiones de 45 minutos listas para usar.'],['Orden recomendado','Empieza por la valoración (I), planifica (II), trabaja la corrección (III), la estabilización (IV) y la respiración (V), y concreta con el módulo por tipo de curva (VI).']];
    h+=head('guide','#b8892e','Guía','Cómo usar el manual')+'<div class="guide">'+st.map(function(s,i){return '<div class="step"><i>'+(i+1)+'</i><div><b>'+s[0]+'</b><p>'+s[1]+'</p></div></div>'}).join('')+
    '<div class="note"><b>Nota:</b> este material es de apoyo y no sustituye el criterio clínico del fisioterapeuta ni la valoración médica. Ante cualquier señal de alarma, deriva al médico.</div></div>'}
  else{var c=CATS[V-1];
    h+=head(c.ic,c.c,modLabel(c)+' · '+c.docs.length+' '+unitName(c),esc(c.t),c.light)+'<p class="mdesc">'+esc(c.d)+'</p><div class="docs">'+DOCS.filter(function(d){return d.cat.id===c.id}).map(function(d){return row(d,0)}).join('')+'</div>'}
  $('right').innerHTML=h+'</div>';drawAppts();
  var q=$('q');q.oninput=function(){var p=q.selectionStart;Q=q.value.trim().toLowerCase();if(Q)document.body.classList.add('open');render();var n=$('q');n.focus();n.setSelectionRange(p,p)}}
function render(){nav();mid();right()}
var TT;function toast(m){var x=$('toast');x.textContent=m;x.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){x.classList.remove('on')},2600)}
/* visor del protocolo */
var CUR=null;
function openDoc(id){
  var d=DOCS.filter(function(x){return x.id===id})[0];if(!d)return;CUR=d;
  var sib=DOCS.filter(function(x){return x.cat.id===d.cat.id}),i=sib.indexOf(d);
  $('vTitle').textContent=modLabel(d.cat)+' · '+d.nn;
  $('vBody').innerHTML=renderDoc(d)+'<div class="vnav">'+(i>0?'<button data-open="'+sib[i-1].id+'">'+ic('prev',16)+'Anterior</button>':'<span></span>')+(i<sib.length-1?'<button data-open="'+sib[i+1].id+'">Siguiente'+ic('next',16)+'</button>':'<span></span>')+'</div>';
  $('vDone').className='btn-d'+(S.done[id]?' on':'');$('vDone').innerHTML=ic('check',16,2.6)+(S.done[id]?'Completado':'Marcar como completado');
  $('vFav').className='star'+(S.fav[id]?' on':'');$('vFav').innerHTML=ic('star',18);
  $('vPdf').href=d.path+'.pdf';$('vPdf').dataset.dl=id;
  $('viewer').classList.add('on');$('vBody').scrollTop=0;document.body.classList.add('lock')}
function closeDoc(){$('viewer').classList.remove('on');document.body.classList.remove('lock');CUR=null;render()}
document.addEventListener('click',function(e){
  var t;
  if(t=e.target.closest('[data-open]')){openDoc(t.dataset.open);return}
  if(t=e.target.closest('[data-v]')){var v=t.dataset.v;Q='';if(v==='home'){document.body.classList.remove('open')}else{V=isNaN(+v)?v:+v;document.body.classList.add('open')}render();window.scrollTo(0,0);return}
  if(t=e.target.closest('[data-back]')){Q='';document.body.classList.remove('open');render();window.scrollTo(0,0);return}
  if(e.target.closest('#vClose')){closeDoc();return}
  if(e.target.closest('#vDone')){if(CUR){if(S.done[CUR.id])delete S.done[CUR.id];else{S.done[CUR.id]=1;toast('Protocolo marcado como completado')}save();openDoc(CUR.id)}return}
  if(e.target.closest('#vFav')){if(CUR){if(S.fav[CUR.id])delete S.fav[CUR.id];else S.fav[CUR.id]=1;save();var b=$('vBody').scrollTop;openDoc(CUR.id);$('vBody').scrollTop=b}return}
  if(t=e.target.closest('[data-fav]')){var k=t.dataset.fav;if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();render();return}
  if(t=e.target.closest('[data-dl]')){e.preventDefault();var href=t.getAttribute('href'),id=t.dataset.dl;
    fetch(href,{method:'HEAD',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;var a=document.createElement('a');a.href=href;a.download=href.split('/').pop();document.body.appendChild(a);a.click();a.remove();S.dl[id]=1;save();toast('Descarga iniciada')}).catch(function(){toast('Este documento se está actualizando. Inténtalo de nuevo en unos minutos.')});return}
  if(t=e.target.closest('[data-add]')){openModal(-1);return}
  if(t=e.target.closest('[data-wk]')){WEEK=+t.dataset.wk;render();return}
  if(t=e.target.closest('[data-slot]')){var p=t.dataset.slot.split('-');openModal(-1,+p[0],+p[1]);return}
  if(t=e.target.closest('[data-name]')){var n=prompt('¿Cómo quieres que te llamemos? (por ejemplo, Marta)',S.name);if(n!==null){S.name=n.trim().slice(0,30);save();render()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();if($('viewer').classList.contains('on'))closeDoc()}});
window.addEventListener('resize',drawAppts);
$('vClose').innerHTML=ic('close',18);var PM=new URLSearchParams(location.search).get('print');
if(PM){var pd=DOCS.filter(function(x){return x.id===PM})[0];document.body.className='print';document.body.innerHTML=renderDoc(pd);document.title=pd.name}
else{render();if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}}

</script>
